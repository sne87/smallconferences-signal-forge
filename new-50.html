<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robert 50 New Research Candidates</title><style>body{font:15px system-ui;background:#101622;color:#f2f4f8;margin:0;padding:24px}main{max-width:1100px;margin:auto}a{color:#b9f46b}h1{margin-bottom:4px}.muted{color:#b4c0ce}input,select,textarea{padding:9px;background:#1d2938;border:1px solid #637286;color:white;border-radius:7px}input{min-width:240px}button{background:#b9f46b;border:0;border-radius:7px;padding:10px;cursor:pointer;font-weight:700}button:disabled{opacity:.4}article{padding:15px;border:1px solid #3b4759;border-radius:12px;background:#1a2534;margin:12px 0}summary{cursor:pointer;font-weight:bold}label{display:block;margin:8px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.flag{color:#eacb98}textarea{width:95%;min-height:80px}.check{display:flex;justify-content:space-between;gap:15px;max-width:780px}.check select{min-width:170px}</style></head><body><main><a href="./priority.html">← Top 10 research queue</a> · <a href="./qualification.html">Qualification Desk</a><h1>Robert's 50 New Research Candidates</h1><p class="muted">50 additional named organizations. Directory members are NOT evidence of current buying intent. Verify event-specific timing before approval.</p><div class="controls"><input id="search" placeholder="Search organizations"><select id="filter"><option value="all">All research candidates</option><option value="approved">Approved by you</option></select><button id="export">Export reviews and approvals</button></div><p id="count"></p><section id="items">Loading...</section></main><script>const storage="robert-new-50-research-v1";let reviews={};try{reviews=JSON.parse(localStorage.getItem(storage)||"{}")}catch{}let data=[];const checks=[["entity","Correct organizer and nonprofit fit"],["revenue","Verified EIN and revenue"],["recurrence","Two prior event cycles"],["scope","Overnight rooms and manageable workload"],["authority","Named authorized decision maker"],["timing","Specific unawarded future decision"],["commitment","Current hotel and planner commitments checked"],["advisor","Evidence of plausible paid advisor engagement"]];function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function save(){localStorage.setItem(storage,JSON.stringify(reviews))}function ready(s){return checks.every(([k])=>s[k]==="Supported")&&/https?:\/\//.test(s.evidence||"")}function render(){let q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;let list=data.filter(p=>p.name.toLowerCase().includes(q)&&(f==="all"||f==="approved"&&reviews[p.id]?.approved||p.qualification_status===f));document.getElementById("count").textContent=list.length+" displayed of "+data.length+" unique candidates; "+Object.values(reviews).filter(x=>x.approved).length+" personally approved";document.getElementById("items").innerHTML=list.map(p=>{let s=reviews[p.id]||{};return '<article><details><summary>'+esc(p.id)+' · '+esc(p.name)+' '+(s.approved?'✓ APPROVED':'')+'</summary><p class="muted">'+esc(p.source_type)+' | '+esc(p.qualification_status)+' | Target year: '+esc(p.event_year||'unknown')+'</p><p>'+esc(p.discovery_evidence)+'</p>'+(p.source_url?'<p><a target="_blank" rel="noopener" href="'+esc(p.source_url)+'">Inspect source</a></p>':'<p class="flag">No verified current buying signal recorded yet</p>')+'+(p.current_research?'<div style="border-left:4px solid #b9f46b;padding:8px 12px;margin:10px 0;background:#202e3f"><strong>Research verdict: '+esc(p.qualification_status)+'</strong><p>'+esc(p.current_research.finding)+'</p><p class="flag"><strong>Counterevidence:</strong> '+esc(p.current_research.counterevidence)+'</p><p><strong>Decision path:</strong> '+esc(p.current_research.decision_path)+'</p><p><strong>Next:</strong> '+esc(p.current_research.next_step)+'</p><p><a href="'+esc(p.current_research.source_url)+'" target="_blank" rel="noopener">Review original evidence</a> · '+esc(p.current_research.source_document_date)+'</p></div>':'<p class="flag">Venue/planner commitment and decision timing remain unknown unless independently verified.</p>')+checks.map(([k,l])=>'<label class="check">'+esc(l)+'<select data-id="'+p.id+'" data-key="'+k+'">'+['Unknown','Supported','Concern'].map(v=>'<option '+((s[k]||'Unknown')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'<label>Supporting evidence URLs and exact dated findings<textarea data-id="'+p.id+'" data-key="evidence">'+esc(s.evidence||'')+'</textarea></label><label>Notes / unresolved contradictions<textarea data-id="'+p.id+'" data-key="notes">'+esc(s.notes||'')+'</textarea></label><p>'+ (s.approved?'Approved by you '+esc(s.approvedAt):ready(s)?'Ready for your final approval':'Unresolved: '+checks.filter(([k])=>s[k]!=="Supported").length+' checks')+'</p><button data-approve="'+p.id+'" '+(ready(s)&&!s.approved?'':'disabled')+'>Approve for Robert</button> <button data-revoke="'+p.id+'">Revoke</button></details></article>'}).join('');document.querySelectorAll("[data-id]").forEach(el=>el.onchange=()=>{let id=el.dataset.id;reviews[id]??={};reviews[id][el.dataset.key]=el.value;if(el.dataset.key!=="notes"){reviews[id].approved=false;reviews[id].approvedAt=null}save();const details=el.closest("details");const idOpen=id;render();const d=[...document.querySelectorAll("article details")].find(x=>x.querySelector("[data-id]")?.dataset.id===idOpen);if(d)d.open=true});document.querySelectorAll("[data-approve]").forEach(el=>el.onclick=()=>{let id=el.dataset.approve,s=reviews[id]||{};if(!ready(s)||!confirm("Approve for Robert? No outreach will be sent."))return;s.approved=true;s.approvedAt=new Date().toISOString();reviews[id]=s;save();render()});document.querySelectorAll("[data-revoke]").forEach(el=>el.onclick=()=>{let id=el.dataset.revoke;reviews[id]??={};reviews[id].approved=false;reviews[id].approvedAt=null;save();render()})}document.getElementById("search").oninput=render;document.getElementById("filter").onchange=render;document.getElementById("export").onclick=()=>{let a=document.createElement("a"),b=new Blob([JSON.stringify({exported_at:new Date().toISOString(),reviews},null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="robert-new-50-research-reviews.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};fetch("./data/new_50_research_candidates.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Not yet deployed");return r.json()}).then(x=>{data=x.prospects;render()}).catch(e=>document.getElementById("items").textContent=e.message)</script></body></html>
