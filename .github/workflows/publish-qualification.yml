name: Publish qualification desk without waiting for scanner
on:
  push:
    branches: [main]
    paths:
      - 'qualification.html'
      - '.github/workflows/publish-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: signal-forge-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare complete static site
        run: |
          set -euo pipefail
          mkdir -p dist/data
          cp index.html qualification.html dist/
          cp data/signals.json data/intelligence.json data/briefs.json data/prospect_universe.json data/rejected_candidates.json data/discovery_history.json data/social_watch.json data/people_watch.json dist/data/
          test -s dist/qualification.html
          test -s dist/data/briefs.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
