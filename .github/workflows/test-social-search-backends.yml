name: Smoke test free public social search backends
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test_public_social_engines.py'
      - '.github/workflows/test-social-search-backends.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe four public web indexes without credentials
        run: python scripts/test_public_social_engines.py
