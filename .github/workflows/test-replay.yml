name: Validate Signal Forge replay filters
on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover.py'
      - 'scripts/test_discover_replay.py'
      - 'scripts/daily_target.py'
      - 'scripts/test_daily_target.py'
      - '.github/workflows/test-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test without network
        run: |
          python -m py_compile scripts/discover.py scripts/daily_target.py
          python scripts/test_discover_replay.py
          python scripts/test_daily_target.py
