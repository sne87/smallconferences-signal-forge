name: Validate Signal Forge discovery and qualification
on:
  push:
    branches: [main, improve-robert-discovery-quality-20261108]
    paths:
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/test-replay.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free PDF dependency
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Compile all scanner modules
        run: python -m compileall -q scripts
      - name: Verify source-first discovery and event-year gating
        run: |
          python scripts/test_discover_replay.py
          python scripts/test_daily_target.py
          python scripts/test_multilane_discovery.py
          python scripts/test_opportunity_gate.py
          python scripts/test_opportunity_cycles.py
          python scripts/test_brief_triage.py
          python scripts/test_prospect_universe.py
          python scripts/test_governance_discovery.py
