name: Scan public signals and publish Signal Forge
on:
  schedule:
    # Hourly at minute 23 UTC; deep enrichment every 4 hours.
    # Schedules are best-effort and can be delayed or skipped by GitHub.
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'watchlist.json'
      - 'watch_pages.json'
      - '.github/workflows/scan-and-publish.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: signal-forge-pages
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test replay filters and syntax
        run: |
          python -m py_compile scripts/discover.py scripts/daily_target.py scripts/primary_source.py scripts/social_monitor.py scripts/merge_public_ai.py scripts/briefs.py
          python scripts/test_discover_replay.py
          python scripts/test_daily_target.py
          python scripts/test_multilane_discovery.py
      - name: Choose lightweight vs deep scan
        id: mode
        shell: bash
        run: |
          hour="$(date -u +%H)"
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( 10#$hour % 4 == 0 )); then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "light=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "light=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Public discovery scan
        env:
          SF_LIGHT_SCAN: ${{ steps.mode.outputs.light }}
        run: python scripts/discover.py
      - name: Auto-research promising clear-name discoveries
        if: steps.mode.outputs.full == 'true'
        run: python scripts/enrich_discoveries.py
      - name: Public organization intelligence
        if: steps.mode.outputs.full == 'true'
        run: python scripts/enrich.py
      - name: Create source-linked research briefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          SF_FULL_SCAN: ${{ steps.mode.outputs.full }}
        run: python scripts/briefs.py
      - name: Save public feed to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "signal-forge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch the latest ChatGPT-written public summaries before committing.
          # The checkout may predate a user or scheduled ChatGPT GitHub edit.
          git fetch origin main
          git show origin/main:data/briefs.json > /tmp/signal-forge-remote-briefs.json || true
          python scripts/merge_public_ai.py /tmp/signal-forge-remote-briefs.json
          git add data/signals.json data/intelligence.json data/briefs.json data/rejected_candidates.json data/discovery_history.json data/social_watch.json
          if git diff --cached --quiet; then
            echo "No new public feed changes to commit."
            exit 0
          fi
          git commit -m "Refresh public discovery feed"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Discovery feed committed."
              exit 0
            fi
            echo "Repository changed during scan; rebasing (attempt ${attempt}/5)."
            git fetch origin main
            git show origin/main:data/briefs.json > /tmp/signal-forge-remote-briefs.json || true
            git -c rebase.autoStash=true rebase -X theirs origin/main
            python scripts/merge_public_ai.py /tmp/signal-forge-remote-briefs.json
            git add data/briefs.json
            if ! git diff --cached --quiet; then git -c core.editor=true commit --amend --no-edit; fi
            sleep "${attempt}"
          done
          echo "Could not publish discovery feed after 5 retries" >&2
          exit 1
      - name: Prepare static app
        run: |
          mkdir -p dist/data
          cp index.html dist/index.html
          cp data/signals.json dist/data/signals.json
          cp data/intelligence.json dist/data/intelligence.json
          cp data/briefs.json dist/data/briefs.json
          cp data/rejected_candidates.json dist/data/rejected_candidates.json
          cp data/discovery_history.json dist/data/discovery_history.json
          cp data/social_watch.json dist/data/social_watch.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4