name: Scan public signals and publish Signal Forge
on:
  schedule:
    # Four public-index scans daily, approximately every six hours.
    # UTC scheduling means local Central times shift during daylight saving time.
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'watchlist.json'
      - '.github/workflows/scan-and-publish.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: signal-forge-pages
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public discovery scan
        run: python scripts/discover.py
      - name: Auto-research promising clear-name discoveries
        run: python scripts/enrich_discoveries.py
      - name: Public organization intelligence
        run: python scripts/enrich.py
      - name: Save public feed to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "signal-forge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json data/intelligence.json
          if git diff --cached --quiet; then
            echo "No new public feed changes to commit."
            exit 0
          fi
          git commit -m "Refresh public discovery feed"
          # Another run or user change may have updated main after checkout.
          # Rebase our feed update on the latest main, preserving newer app changes.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Public feed saved successfully."
              exit 0
            fi
            echo "Remote moved; fetching and rebasing feed update (attempt ${attempt}/5)."
            git fetch origin main
            git -c rebase.autoStash=true rebase -X theirs origin/main
            sleep "${attempt}"
          done
          echo "Unable to publish discovery feed after retries." >&2
          exit 1
      - name: Prepare static app
        run: |
          mkdir -p dist/data
          cp index.html dist/index.html
          cp data/signals.json dist/data/signals.json
          cp data/intelligence.json dist/data/intelligence.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4